<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symapse Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#030303;color:#ededed;font:13px/1.5 Inter,-apple-system,sans-serif;overflow:hidden;font-feature-settings:"cv02","cv03","cv11"}
:root{--bg:#030303;--panel:#0a0a0a;--border:rgba(255,255,255,.06);--muted:#878787;--main:#ededed;--green:#2e9c68;--amber:#b58e33;--red:#a84343}
.noise{position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect w='100%25' h='100%25' filter='url(%23f)'/%3E%3C/svg%3E");opacity:.04;pointer-events:none;z-index:60}
.mesh{position:fixed;inset:0;z-index:1;pointer-events:none}
.mesh-node{position:absolute;border-radius:50%;filter:blur(120px);opacity:.22;mix-blend-mode:screen}
.frame{border:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:relative;z-index:10}
.topbar{height:44px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#050505;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted)}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;border-right:1px solid var(--border);background:#030303;display:flex;flex-direction:column;padding:20px 12px;flex-shrink:0}
.nav-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);border:1px solid transparent;background:none;cursor:pointer;transition:all .15s;text-align:left;width:100%}
.nav-btn:hover{color:var(--main);background:rgba(255,255,255,.03)}
.nav-btn.active{color:var(--main);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.05)}
.nav-btn svg{width:15px;height:15px;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:28px;background:#000}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card-header{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-val{font-size:26px;font-weight:700;color:var(--green);line-height:1;margin-bottom:4px}
.stat-label{font-size:11px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar-label{font-size:11px;color:var(--muted);width:140px;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:6px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.bar-val{font-size:11px;color:var(--muted);width:40px;text-align:right;flex-shrink:0}
.badge{display:inline-block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px}
.badge-green{background:rgba(46,156,104,.1);color:var(--green);border:1px solid rgba(46,156,104,.2)}
.badge-amber{background:rgba(181,142,51,.1);color:var(--amber);border:1px solid rgba(181,142,51,.2)}
.badge-red{background:rgba(168,67,67,.1);color:var(--red);border:1px solid rgba(168,67,67,.2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--main)}
.btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:hover{opacity:.9}
.session-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.session-row:last-child{border-bottom:none}
.session-id{font-size:12px;color:var(--main);font-family:monospace}
.session-meta{font-size:11px;color:var(--muted)}
.memory-section{margin-bottom:20px}
.memory-type{font-size:12px;font-weight:600;color:var(--main);margin-bottom:8px;text-transform:capitalize}
.memory-item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.02)}
.memory-key{font-size:12px;color:var(--main);font-family:monospace;margin-bottom:2px}
.memory-val{font-size:11px;color:var(--muted)}
.placeholder{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.placeholder svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}
.spinner{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toggle{width:36px;height:20px;border-radius:10px;cursor:pointer;transition:background .2s;position:relative}
.toggle.on{background:rgba(46,156,104,.3);border:1px solid rgba(46,156,104,.5)}
.toggle.off{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.toggle::after{content:'';position:absolute;top:2px;width:14px;height:14px;border-radius:50%;background:var(--main);transition:left .2s}
.toggle.on::after{left:18px}.toggle.off::after{left:2px}
</style>
</head>
<body>
<div class="noise"></div>
<div class="mesh" id="mesh">
  <div class="mesh-node" style="width:600px;height:600px;background:#555;top:-10%;left:5%"></div>
  <div class="mesh-node" style="width:500px;height:500px;background:#666;bottom:-15%;right:10%"></div>
</div>
<div class="frame">
  <div class="topbar">
    <div class="topbar-left">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
      <span>symapse-core</span>
      <span style="opacity:.3">/</span>
      <span id="tab-name" style="color:var(--main)">dashboard</span>
    </div>
    <div class="topbar-right">
      <span id="repo-indicator">—</span>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <button class="nav-btn active" onclick="showTab('efficiency',this)" id="nav-efficiency">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>Efficiency
      </button>
      <button class="nav-btn" onclick="showTab('activity',this)" id="nav-activity">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>Agent Activity
      </button>
      <button class="nav-btn" onclick="showTab('findings',this)" id="nav-findings">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M19.4 15.4a2 2 0 00-1-.5l-2.4-.5a6 6 0 00-3.9.5l-.3.2a6 6 0 01-3.9.5L6 15.2a2 2 0 00-1.8.5M8 4h8l-1 1v5.2a2 2 0 00.6 1.4l5 5c1.3 1.3.4 3.4-1.4 3.4H4.8c-1.8 0-2.7-2.2-1.4-3.4l5-5A2 2 0 009 10.2V5L8 4z"/></svg>Findings
      </button>
      <button class="nav-btn" onclick="showTab('memory',this)" id="nav-memory">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M4 4v5h.6m0 0a7 7 0 1014.8 0H4.6z"/></svg>Memory
      </button>
      <button class="nav-btn" onclick="showTab('settings',this)" id="nav-settings" style="margin-top:auto">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M10.3 4.3c.4-1.7 2.9-1.7 3.4 0a1.7 1.7 0 002.5 1c1.6-.9 3.3.8 2.4 2.4a1.7 1.7 0 001 2.6c1.8.4 1.8 2.9 0 3.3a1.7 1.7 0 00-1 2.6c.9 1.5-.8 3.3-2.4 2.4a1.7 1.7 0 00-2.6 1c-.4 1.8-2.9 1.8-3.3 0a1.7 1.7 0 00-2.6-1c-1.5.9-3.3-.8-2.4-2.4a1.7 1.7 0 00-1-2.6c-1.8-.4-1.8-2.9 0-3.3a1.7 1.7 0 001-2.6c-.9-1.5.8-3.3 2.4-2.4.9.6 2.3 0 2.5-1z"/><circle cx="12" cy="12" r="3"/></svg>Settings
      </button>
    </div>
    <div class="main" id="content"></div>
  </div>
</div>

<script>
const API = '/dashboard';
let activeTab = 'efficiency';

function showTab(tab, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = tab;
  document.getElementById('tab-name').textContent = tab;
  if (tab === 'findings') renderFindings();
  else if (tab === 'memory') renderMemory();
  else if (tab === 'activity') renderActivity();
  else if (tab === 'efficiency') renderEfficiency();
  else if (tab === 'settings') renderSettings();
}

async function fetchJSON(path) { const r = await fetch(path); return r.json(); }

async function renderEfficiency() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="placeholder"><div class="spinner" style="width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;margin:0 auto 12px"></div>Loading...</div>';
  try {
    const d = await fetchJSON(API+'/efficiency');
    const maxVal = Math.max(...d.toolCounts.map(t=>t[1]),1);
    c.innerHTML = `
      <div class="stats">
        <div class="card"><div class="stat-val">${(d.totalTokens/1000).toFixed(0)}k</div><div class="stat-label">Tokens Used</div></div>
        <div class="card"><div class="stat-val">${(d.savedTokens/1000).toFixed(0)}k</div><div class="stat-label">Tokens Saved</div></div>
        <div class="card"><div class="stat-val">$${d.totalCost}</div><div class="stat-label">Est. Cost Saved</div></div>
        <div class="card"><div class="stat-val">${d.sessionCount}</div><div class="stat-label">Agent Sessions</div></div>
      </div>
      <div class="card">
        <div class="card-header">Most Used Tools</div>
        ${d.toolCounts.map(([name,count],i) => `<div class="bar"><span class="bar-label">${i+1}. ${name}</span><div class="bar-track"><div class="bar-fill" style="width:${(count/maxVal*100)}%"></div></div><span class="bar-val">${count}</span></div>`).join('')}
      </div>`;
  } catch(e) { c.innerHTML = '<div class="placeholder">Could not load efficiency data.</div>'; }
}

async function renderActivity() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="placeholder"><div class="spinner" style="width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;margin:0 auto 12px"></div>Loading...</div>';
  try {
    const d = await fetchJSON(API+'/sessions');
    if (!d.sessions.length) { c.innerHTML = '<div class="placeholder">No agent activity recorded yet.</div>'; return; }
    let html = '';
    for (const s of d.sessions) {
      html += `<div class="card"><div class="card-header">${s.sessionId.substring(0,16)}... <span class="badge badge-green">${s.toolCalls} calls</span></div>`;
      for (const a of (s.actions||[]).slice(0,8)) {
        html += `<div class="session-row"><span class="session-id">${a.tool}: ${a.target}</span><span class="session-meta">${(a.time||'').substring(0,19)}</span></div>`;
      }
      html += '</div>';
    }
    c.innerHTML = html;
  } catch(e) { c.innerHTML = '<div class="placeholder">Could not load activity data.</div>'; }
}

async function renderFindings() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="card" style="text-align:center;padding:48px">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="var(--muted)" stroke-width="1" style="margin:0 auto 16px;opacity:.4"><path d="M19.4 15.4a2 2 0 00-1-.5l-2.4-.5a6 6 0 00-3.9.5l-.3.2a6 6 0 01-3.9.5L6 15.2a2 2 0 00-1.8.5M8 4h8l-1 1v5.2a2 2 0 00.6 1.4l5 5c1.3 1.3.4 3.4-1.4 3.4H4.8c-1.8 0-2.7-2.2-1.4-3.4l5-5A2 2 0 009 10.2V5L8 4z"/></svg>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Run architectural analysis to discover duplicates, risks, and volatile functions.</p>
      <button class="btn btn-primary" onclick="runFindings()" id="findings-btn">Run Analysis</button>
    </div>`;
}

async function runFindings() {
  const btn = document.getElementById('findings-btn');
  btn.innerHTML = '<span class="spinner" style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%"></span> Analyzing...';
  btn.disabled = true;
  try {
    const d = await fetchJSON(API+'/findings');
    let html = '';
    if (d.findings.length > 0) {
      html += `<div class="card"><div class="card-header">Duplicate Discoveries <span class="badge badge-amber">${d.findings.length}</span></div>`;
      for (const f of d.findings) html += `<div class="session-row"><span class="session-id">${f.key}</span><span class="session-meta">${f.value}</span></div>`;
      html += '</div>';
    }
    if (d.patterns.length > 0) {
      html += `<div class="card"><div class="card-header">Workflow Patterns <span class="badge badge-green">${d.patterns.length}</span></div>`;
      for (const p of d.patterns) html += `<div class="session-row"><span class="session-id">${p.key}</span><span class="session-meta">${p.value}</span></div>`;
      html += '</div>';
    }
    if (!d.findings.length && !d.patterns.length) {
      html = '<div class="placeholder"><svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="var(--muted)" stroke-width="1" style="margin:0 auto 12px;opacity:.3"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg>No findings yet. Keep using Symapse and check back.</div>';
    }
    document.getElementById('content').innerHTML = html;
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="placeholder">Analysis failed. Try again.</div>';
  }
}

async function renderMemory() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="placeholder"><div class="spinner" style="width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;margin:0 auto 12px"></div>Loading...</div>';
  try {
    const d = await fetchJSON(API+'/memory');
    if (!d.total) { c.innerHTML = '<div class="placeholder"><svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="var(--muted)" stroke-width="1" style="margin:0 auto 12px;opacity:.3"><path d="M4 4v5h.6m0 0a7 7 0 1014.8 0H4.6z"/></svg>No memory entries yet. Symapse learns patterns as agents use it across sessions.</div>'; return; }
    let html = '';
    const types = {'finding': 'Findings', 'calibration': 'Calibrations', 'pattern': 'Patterns', 'workflow_symbols': 'Workflows', 'workflow_files': 'Workflow Files'};
    for (const [type, entries] of Object.entries(d.byType)) {
      html += `<div class="memory-section"><div class="memory-type">${types[type]||type} <span class="badge badge-green">${entries.length}</span></div>`;
      for (const e of entries.slice(0,10)) html += `<div class="memory-item"><div class="memory-key">${e.key}</div><div class="memory-val">${e.value} <span style="opacity:.4">· ${(e.timestamp||'').substring(0,19)}</span></div></div>`;
      html += '</div>';
    }
    c.innerHTML = html;
  } catch(e) { c.innerHTML = '<div class="placeholder">Could not load memory data.</div>'; }
}

function renderSettings() {
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-header">Repository</div>
      <div class="memory-item"><div class="memory-key">Current Path</div><div class="memory-val" id="repo-path">Loading...</div></div>
    </div>
    <div class="card">
      <div class="card-header">Index</div>
      <div class="session-row"><span style="font-size:13px">Re-index repository</span><button class="btn" onclick="reindex()">Run Index</button></div>
      <div class="session-row" style="margin-top:12px"><span style="font-size:13px">Clear knowledge store</span><button class="btn" style="border-color:var(--red);color:var(--red)" onclick="clearMemory()">Clear</button></div>
    </div>
  `;
  fetchJSON('/status').then(s => {
    document.getElementById('repo-path').textContent = s.repoRoot || 'Unknown';
    document.getElementById('repo-indicator').textContent = (s.repoRoot||'').split('/').pop() || '—';
  }).catch(()=>{});
}

async function reindex() {
  await fetch('/refresh');
  location.reload();
}

async function clearMemory() {
  if (confirm('Clear all learned patterns and findings?')) {
    await fetch('/memory/clear', {method:'POST'});
    location.reload();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderEfficiency();
  fetchJSON('/status').then(s => {
    document.getElementById('repo-indicator').textContent = (s.repoRoot||'').split('/').pop() || '—';
  }).catch(()=>{});
});
</script>
</body>
</html>
